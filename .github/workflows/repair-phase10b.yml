name: Repair Phase 10b

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair scene initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ss/voice/MainActivity.kt')
          s = p.read_text()

          old = 'setupControls(); setupProfiles(); setupVoiceLibrary(); setupAudiobookMode(); setupScenes(); updateCacheStatus(); clearTimeline()'
          new = 'setupControls(); setupProfiles(); setupVoiceLibrary(); setupAudiobookMode(); refreshSceneList(); updateCacheStatus(); clearTimeline()'
          if old not in s:
              raise SystemExit('Expected onCreate initialization line not found')
          s = s.replace(old, new, 1)

          duplicate = '''\n    private fun setupScenes() {\n        refreshSceneList()\n    }\n\n    private fun getScenesUsingVoice(voiceKey: String): List<String> {\n        val result = mutableListOf<String>()\n        val scenes = getScenes()\n        for (i in 0 until scenes.length()) {\n            val scene = scenes.optJSONObject(i) ?: continue\n            val profiles = scene.optJSONArray("profiles") ?: continue\n            var usesVoice = false\n            for (j in 0 until profiles.length()) {\n                val profile = profiles.optJSONObject(j) ?: continue\n                if (profile.optString("voice", "") == voiceKey) {\n                    usesVoice = true\n                    break\n                }\n            }\n            if (usesVoice) result += scene.optString("title", "Unbenannte Szene")\n        }\n        return result\n    }\n'''
          if duplicate in s:
              s = s.replace(duplicate, '\n', 1)
          else:
              raise SystemExit('Expected duplicate scene helper block not found')

          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'S.S.'
          git config user.email 'safijasamsudinova@gmail.com'
          git add app/src/main/java/com/ss/voice/MainActivity.kt
          git commit -m 'fix: remove broken phase 10 scene initializer' || exit 0
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/repair-phase10b.yml
          git commit -m 'chore: remove temporary phase 10 repair workflow'
          git push origin main
