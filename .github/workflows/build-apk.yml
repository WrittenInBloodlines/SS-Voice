name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Sherpa-ONNX Android AAR
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            -o app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar

      - name: Download Piper model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o /tmp/thorsten.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-de_DE-thorsten-medium.tar.bz2
          tar -xjf /tmp/thorsten.tar.bz2 -C app/src/main/assets

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-Voice-debug
          path: app/build/outputs/apk/debug/app-debug.apk
