name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Sherpa-ONNX Android AAR
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            -o app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar

      - name: Download Piper voices
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o /tmp/ryan.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-ryan-medium.tar.bz2
          curl -L --fail --retry 3 \
            -o /tmp/lessac.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2
          curl -L --fail --retry 3 \
            -o /tmp/amy.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-medium.tar.bz2
          tar -xjf /tmp/ryan.tar.bz2 -C app/src/main/assets
          tar -xjf /tmp/lessac.tar.bz2 -C app/src/main/assets
          tar -xjf /tmp/amy.tar.bz2 -C app/src/main/assets

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-Voice-debug
          path: app/build/outputs/apk/debug/app-debug.apk
